# Diffusion des vidéos E-Masterclass.
#
# Mise en service :
#   npx wrangler login                             # ou CLOUDFLARE_API_TOKEN dans l'environnement
#   npx wrangler r2 bucket create emasterclass-videos
#   npx wrangler secret put VIDEO_SIGNING_SECRET   # même valeur que le .env de l'application
#   npx wrangler deploy
#
# ⚠ Les routes de dépôt (/_televersement/*) n'existent que dans les versions
# déployées après septembre 2026. Sans redéploiement, l'ouverture d'un
# téléversement depuis l'administration échoue sur « Le diffuseur a refusé
# l'opération "ouvrir" — Méthode non autorisée » : le POST ne trouve pas la
# route et retombe sur le garde-fou lecture seule, qui répond 405. Le remède
# est `npx wrangler deploy` depuis ce dossier, rien dans l'application.
#
# À poser une fois sur le seau, faute de quoi les parts d'un dépôt abandonné
# restent facturées indéfiniment — c'est le filet de dernier recours derrière
# la tâche quotidienne `video:purger` :
#   npx wrangler r2 bucket lifecycle add emasterclass-videos \
#     --name abandonner-multipart --abort-multipart-days 7
#
# Puis renseigner VIDEO_BASE_URL dans le .env de l'application avec l'URL du
# Worker (ou le domaine personnalisé qui lui est rattaché).

name = "emasterclass-videos"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Origines autorisées à lire les vidéos depuis un navigateur. Sans cette liste,
# le lecteur du site se voit refuser la réponse par le navigateur lui-même.
# Aucune adresse locale en production (audit du 20/10) : le poste de
# développement passe par l'environnement `developpement`, plus bas.
[vars]
ORIGINES_AUTORISEES = "https://emasterclass.bigfive.solutions,https://masterclass-omega-five.vercel.app,https://masterclass-jhouedanous-projects.vercel.app"
# Transition du préfixe « lecture. » (20/10/2026). Le Worker accepte aussi les
# autorisations signées à l'ancien format tant que cette variable vaut « oui » :
# il se déploie donc avant l'application sans couper une vidéo. Quatre heures
# après le déploiement de l'application, passer à « non » et redéployer.
LECTURE_ANCIEN_FORMAT = "oui"

[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "emasterclass-videos"

# Poste de développement : un second Worker, `emasterclass-videos-developpement`,
# qui lit le même seau pour les origines locales.
#   npx wrangler deploy --env developpement
#   npx wrangler secret put VIDEO_SIGNING_SECRET --env developpement
# puis VIDEO_BASE_URL du .env local vers son adresse. Les variables et le seau
# ne s'héritent pas d'un environnement à l'autre : ils sont redéclarés ici.
[env.developpement.vars]
ORIGINES_AUTORISEES = "http://localhost:3000,http://localhost:3001,http://localhost:3002,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002"
LECTURE_ANCIEN_FORMAT = "non"

[[env.developpement.r2_buckets]]
binding = "VIDEOS"
bucket_name = "emasterclass-videos"

# VIDEO_SIGNING_SECRET est un secret : il se pose avec `wrangler secret put`,
# jamais dans ce fichier, qui est versionné.
